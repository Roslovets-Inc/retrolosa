name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload browser diagnostics and unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-and-browser-diagnostics
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
